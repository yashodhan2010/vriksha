    { "id": "admin_review", "name": "Admin Review Surface", "status": "partial", "summary": "KYC review is implemented; broader publishing/grants console is mostly a task shell.", "description": "Admin role checks protect /admin and /admin/kyc. KYC review can update decisions and audit events; other publishing tasks are listed but not yet implemented as full workflows.", "nodes": ["admin_console", "admin_kyc", "access_lib", "supabase_db", "storage_bucket", "resend"], "edges": [["admin_console", "admin_kyc"], ["admin_kyc", "access_lib"], ["admin_kyc", "supabase_db"], ["admin_kyc", "storage_bucket"], ["admin_kyc", "resend"]] }
  ]
}

<div class="shell"><header class="topbar"><div><p class="kicker">Architecture Map</p><h1 id="title"></h1><p class="subtitle" id="subtitle"></p></div><div class="toolbar"><button class="button" id="clearFlow" type="button">Clear highlight</button><button class="button" id="themeToggle" type="button">Toggle theme</button></div></header><main class="layout"><section class="diagram-card" aria-label="Architecture diagram"><div class="diagram-scroll"><svg class="diagram" id="diagram" role="img" aria-labelledby="title subtitle"></svg></div><div class="tooltip" id="tooltip"></div></section><aside><section class="panel"><h2>Trace A Flow</h2><div class="flow-list" id="flowList"></div><div class="legend" id="legend"></div></section><section class="detail" id="detail"><h2>Node Detail</h2><p class="empty">Click any node to inspect its role and see which flows include it.</p></section></aside></main></div>
<script>
const model=JSON.parse(document.getElementById('model').textContent);
const svg=document.getElementById('diagram'),flowList=document.getElementById('flowList'),tooltip=document.getElementById('tooltip'),detail=document.getElementById('detail');
const NS='http://www.w3.org/2000/svg',nodeW=172,nodeH=78;let activeFlow=null,selectedNode=null;const nodeMap=new Map(model.nodes.map(n=>[n.id,n]));
const edgeKey=e=>e.from+'->'+e.to;document.getElementById('title').textContent=model.meta.title;document.getElementById('subtitle').textContent=model.meta.subtitle+' Generated from '+model.meta.generated_from+'.';svg.setAttribute('viewBox','0 0 '+model.meta.canvas.width+' '+model.meta.canvas.height);
function setTheme(mode){document.documentElement.dataset.theme=mode;localStorage.setItem('vriksha-arch-theme',mode)}const saved=localStorage.getItem('vriksha-arch-theme');setTheme(saved||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));document.getElementById('themeToggle').onclick=()=>setTheme(document.documentElement.dataset.theme==='dark'?'light':'dark');
function el(name,attrs={}){const e=document.createElementNS(NS,name);for(const [k,v]of Object.entries(attrs))e.setAttribute(k,v);return e}
function anchor(from,to){const fx=from.x+nodeW/2,fy=from.y+nodeH/2,tx=to.x+nodeW/2,ty=to.y+nodeH/2,dx=tx-fx,dy=ty-fy,sx=dx===0?0:Math.sign(dx),sy=dy===0?0:Math.sign(dy);let x1=fx,y1=fy,x2=tx,y2=ty;if(Math.abs(dx)/nodeW>Math.abs(dy)/nodeH){x1=fx+sx*nodeW/2;y1=fy+(dy/Math.max(Math.abs(dx),1))*nodeW/2;x2=tx-sx*nodeW/2;y2=ty-(dy/Math.max(Math.abs(dx),1))*nodeW/2}else{x1=fx+(dx/Math.max(Math.abs(dy),1))*nodeH/2;y1=fy+sy*nodeH/2;x2=tx-(dx/Math.max(Math.abs(dy),1))*nodeH/2;y2=ty-sy*nodeH/2}return{x1,y1,x2,y2,dx:x2-x1}}
function wrap(label,max=18){const words=label.split(' '),lines=[''];for(const w of words){const next=(lines[lines.length-1]+' '+w).trim();if(next.length>max&&lines[lines.length-1])lines.push(w);else lines[lines.length-1]=next}return lines.slice(0,2)}
function draw(){svg.replaceChildren();const defs=el('defs'),marker=el('marker',{id:'arrow',viewBox:'0 0 10 10',refX:'9',refY:'5',markerWidth:'7',markerHeight:'7',orient:'auto-start-reverse'});marker.appendChild(el('path',{d:'M 0 0 L 10 5 L 0 10 z',fill:'var(--edge)'}));defs.appendChild(marker);svg.appendChild(defs);const edgeLayer=el('g',{id:'edges'}),nodeLayer=el('g',{id:'nodes'});svg.append(edgeLayer,nodeLayer);for(const e of model.edges){const from=nodeMap.get(e.from),to=nodeMap.get(e.to);if(!from||!to)continue;const a=anchor(from,to),curve=Math.max(70,Math.min(180,Math.abs(a.dx)*.45));const d='M '+a.x1+' '+a.y1+' C '+(a.x1+curve)+' '+a.y1+', '+(a.x2-curve)+' '+a.y2+', '+a.x2+' '+a.y2;const g=el('g',{class:'edge '+e.kind,id:'edge-'+edgeKey(e).replace(/[^a-zA-Z0-9]/g,'-'),'data-edge':edgeKey(e)});g.appendChild(el('path',{class:'edge-path',d,markerEnd:'url(#arrow)'}));edgeLayer.appendChild(g)}for(const n of model.nodes){const group=model.meta.groups[n.group],color=(group&&group.color)||'#777';const g=el('g',{class:'node',transform:'translate('+n.x+','+n.y+')','data-node':n.id,tabindex:'0'});g.appendChild(el('rect',{width:nodeW,height:nodeH,rx:8,ry:8,style:'fill:color-mix(in srgb, '+color+' 13%, var(--panel));stroke:color-mix(in srgb, '+color+' 70%, var(--line));'}));g.appendChild(el('circle',{cx:15,cy:16,r:5,class:'status-dot status-'+n.status}));wrap(n.label).forEach((line,i)=>{const t=el('text',{x:30,y:20+i*17,class:'node-label'});t.textContent=line;g.appendChild(t)});if(n.tech){const t=el('text',{x:14,y:64,class:'node-tech'});t.textContent=n.tech.length>28?n.tech.slice(0,27)+'...':n.tech;g.appendChild(t)}g.addEventListener('mouseenter',ev=>showTip(ev,n));g.addEventListener('mousemove',moveTip);g.addEventListener('mouseleave',hideTip);g.addEventListener('click',()=>selectNode(n.id));nodeLayer.appendChild(g)}}
function renderFlows(){for(const f of model.flows){const b=document.createElement('button');b.className='flow-btn';b.type='button';b.dataset.flow=f.id;b.innerHTML='<strong>'+f.name+'</strong><span>'+f.summary+'</span>';b.onclick=()=>toggleFlow(f.id);flowList.appendChild(b)}}
function renderLegend(){const root=document.getElementById('legend');root.innerHTML='<div><h2>Groups</h2><div class="legend-grid" id="groupLegend"></div></div><div><h2>Status</h2><div class="legend-grid"><span class="legend-item"><i class="status-dot status-built"></i>Built</span><span class="legend-item"><i class="status-dot status-partial"></i>Partial</span><span class="legend-item"><i class="status-dot status-planned"></i>Planned</span></div></div>';const gl=root.querySelector('#groupLegend');for(const [id,g]of Object.entries(model.meta.groups)){const item=document.createElement('span');item.className='legend-item';item.innerHTML='<i class="swatch" style="background:'+g.color+'"></i>'+g.label;gl.appendChild(item)}}
function toggleFlow(id){activeFlow=activeFlow&&activeFlow.id===id?null:model.flows.find(f=>f.id===id);applyState()}function applyState(){document.querySelectorAll('.flow-btn').forEach(b=>b.classList.toggle('active',!!activeFlow&&b.dataset.flow===activeFlow.id));const activeNodes=new Set(activeFlow?activeFlow.nodes:[]),activeEdges=new Set((activeFlow?activeFlow.edges:[]).map(p=>p[0]+'->'+p[1]));document.querySelectorAll('.node').forEach(g=>{const on=!activeFlow||activeNodes.has(g.dataset.node);g.classList.toggle('dim',!on);g.classList.toggle('highlight',!!activeFlow&&activeNodes.has(g.dataset.node));g.classList.toggle('selected',selectedNode===g.dataset.node)});document.querySelectorAll('.edge').forEach(g=>{const on=!activeFlow||activeEdges.has(g.dataset.edge);g.classList.toggle('dim',!on);g.classList.toggle('highlight',!!activeFlow&&activeEdges.has(g.dataset.edge))})}
function showTip(ev,n){tooltip.innerHTML='<strong>'+n.label+'</strong><p><span class="pill"><i class="status-dot status-'+n.status+'"></i>'+n.status+'</span></p><p>'+(n.tooltip||'')+'</p>'+(n.file?'<p><code>'+n.file+'</code></p>':'')+(n.tech?'<p>'+n.tech+'</p>':'');tooltip.classList.add('visible');moveTip(ev)}function moveTip(ev){tooltip.style.left=Math.min(window.innerWidth-360,ev.clientX+14)+'px';tooltip.style.top=Math.min(window.innerHeight-190,ev.clientY+14)+'px'}function hideTip(){tooltip.classList.remove('visible')}
function selectNode(id){selectedNode=id;const n=nodeMap.get(id),flows=model.flows.filter(f=>f.nodes.includes(id));detail.innerHTML='<h2>'+n.label+'</h2><p><span class="pill"><i class="status-dot status-'+n.status+'"></i>'+n.status+'</span>'+(n.noncanonical?' <span class="pill">noncanonical</span>':'')+'</p><p>'+(n.tooltip||'')+'</p>'+(n.tech?'<p><strong>Tech:</strong> '+n.tech+'</p>':'')+(n.file?'<p><strong>File:</strong> <code>'+n.file+'</code></p>':'')+'<p><strong>Flows:</strong> '+(flows.length?flows.map(f=>f.name).join(', '):'None listed')+'</p>';applyState()}
document.getElementById('clearFlow').onclick=()=>{activeFlow=null;applyState()};draw();renderFlows();renderLegend();applyState();
</script>
</body>
